name: Build hdsentinel deb/rpm packages

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: i386 }
          - { arch: amd64 }
          - { arch: armhf }
          - { arch: arm64 }
          - { arch: armel }

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install packaging tools (ruby + fpm + rpm)
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby ruby-dev build-essential rpm unzip gzip
          sudo gem install fpm

      - name: Download binaries (已提交则跳过)
        run: bash ./scripts/download-binaries.sh

      - name: Build ${{ matrix.arch }} packages
        env:
          PKG_VERSION: "0.20"
        run: bash ./scripts/build-packages.sh ${{ matrix.arch }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hdsentinel-${{ matrix.arch }}
          # 注意: armhf 的 rpm 分 armv7hl/armv6hl, armel 的 rpm 是 armv5tel,
          # 文件名不一定含 arch 字样, 故直接收集 dist/ 下全部 hdsentinel* 产物
          path: dist/hdsentinel*
          if-no-files-found: error

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/hdsentinel*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Build hdsentinel deb/rpm packages

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: i386 }
          - { arch: amd64 }
          - { arch: armv5 }
          - { arch: armv6 }
          - { arch: armv7 }
          - { arch: aarch64 }

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install packaging tools (ruby + fpm + rpm)
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby ruby-dev build-essential rpm unzip gzip
          sudo gem install fpm

      - name: Download binaries (已提交则跳过)
        run: bash ./scripts/download-binaries.sh

      - name: Build ${{ matrix.arch }} packages
        # 版本号由 build-packages.sh 从 release 的 v* 标签读取, 不在此硬编码
        run: bash ./scripts/build-packages.sh ${{ matrix.arch }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: hdsentinel-${{ matrix.arch }}
          # ARM 已按 armv5/v6/v7/aarch64 拆为独立包, 文件名含各自架构,
          # 直接收集 dist/ 下全部 hdsentinel* 产物即可
          path: dist/hdsentinel*
          if-no-files-found: error

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/hdsentinel*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
